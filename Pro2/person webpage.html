<!DOCTYPE html>
<html>
<head>
    <title>My CSS Web Page</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: darkgreen;
            font-size: 20px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 30px;
            border: 3px solid blue;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Welcome to My Web Page</h1>

        <p>
            This is a simple web page created using HTML and CSS.
        </p>

        <p>
            CSS is used to change the
            <b>colors, fonts and styles</b> of a webpage.
        </p>

    </div>

</body>
</html>
