<!DOCTYPE html>
<html>

<head>
    <title>React Shopping Cart</title>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f3ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #7c3aed;
        }

        h2 {
            color: #333;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            color: #16a34a;
        }

        .quantity {
            font-size: 30px;
            font-weight: bold;
            color: #7c3aed;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #7c3aed;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #5b21b6;
        }

        .total {
            margin-top: 20px;
            padding: 15px;
            background-color: #ede9fe;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        // Product Component
        function Product(props) {

            // State
            const [quantity, setQuantity] = React.useState(1);

            // Event Handling
            function increase() {
                setQuantity(quantity + 1);
            }

            function decrease() {
                if (quantity > 1) {
                    setQuantity(quantity - 1);
                }
            }

            function reset() {
                setQuantity(1);
            }

            // Calculate total
            const total = props.price * quantity;

            return (
                <div className="container">

                    <h1>Shopping Cart</h1>

                    {/* Props */}
                    <h2>{props.productName}</h2>

                    <p>
                        <b>Category:</b> {props.category}
                    </p>

                    <p className="price">
                        ₹{props.price}
                    </p>

                    <hr />

                    <h2>Quantity</h2>

                    {/* State */}
                    <p className="quantity">
                        {quantity}
                    </p>

                    {/* Event Handling */}
                    <button onClick={increase}>
                        +
                    </button>

                    <button onClick={decrease}>
                        -
                    </button>

                    <button onClick={reset}>
                        Reset
                    </button>

                    <div className="total">
                        Total Price: ₹{total}
                    </div>

                </div>
            );
        }


        // App Component
        function App() {

            return (
                <div>

                    <Product
                        productName="Wireless Headphones"
                        category="Electronics"
                        price={1500}
                    />

                </div>
            );
        }


        // Render React Application
        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>

</body>

</html>
