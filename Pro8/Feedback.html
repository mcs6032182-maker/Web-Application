<!DOCTYPE html>
<html>

<head>
    <title>React Student Feedback</title>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #06b6d4, #2563eb);
        }

        .feedback-container {
            width: 400px;
            margin: 70px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }

        .success {
            color: green;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

// Reusable Input Component
function InputField({
    label,
    type,
    value,
    onChange,
    placeholder
}) {
    return (
        <div className="input-group">

            <label>{label}</label>

            <input
                type={type}
                value={value}
                onChange={onChange}
                placeholder={placeholder}
            />

        </div>
    );
}


// Feedback Form Component
function FeedbackForm() {

    const [name, setName] = React.useState("");
    const [course, setCourse] = React.useState("");
    const [rating, setRating] = React.useState("");
    const [feedback, setFeedback] = React.useState("");

    const [error, setError] = React.useState("");
    const [success, setSuccess] = React.useState("");


    // Handle Form Submit
    function handleSubmit(event) {

        event.preventDefault();

        setError("");
        setSuccess("");

        if (
            name.trim() === "" ||
            course === "" ||
            rating === "" ||
            feedback.trim() === ""
        ) {
            setError("Please fill all the fields.");
            return;
        }

        setSuccess(
            "Thank you " + name + "! Your feedback was submitted."
        );

        // Clear form
        setName("");
        setCourse("");
        setRating("");
        setFeedback("");
    }


    return (
        <div className="feedback-container">

            <h1>Student Feedback</h1>

            <form onSubmit={handleSubmit}>

                {/* Name */}
                <InputField
                    label="Student Name"
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Enter your name"
                />


                {/* Course */}
                <div className="input-group">

                    <label>Course</label>

                    <select
                        value={course}
                        onChange={(e) => setCourse(e.target.value)}
                    >
                        <option value="">
                            Select Course
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="BSc Computer Science">
                            BSc Computer Science
                        </option>

                        <option value="B.Com">
                            B.Com
                        </option>

                        <option value="BBA">
                            BBA
                        </option>
                    </select>

                </div>


                {/* Rating */}
                <div className="input-group">

                    <label>Rating</label>

                    <select
                        value={rating}
                        onChange={(e) => setRating(e.target.value)}
                    >
                        <option value="">
                            Select Rating
                        </option>

                        <option value="Excellent">
                            Excellent
                        </option>

                        <option value="Good">
                            Good
                        </option>

                        <option value="Average">
                            Average
                        </option>

                        <option value="Poor">
                            Poor
                        </option>
                    </select>

                </div>


                {/* Feedback */}
                <div className="input-group">

                    <label>Feedback</label>

                    <textarea
                        value={feedback}
                        onChange={(e) =>
                            setFeedback(e.target.value)
                        }
                        placeholder="Enter your feedback"
                    >
                    </textarea>

                </div>


                <button type="submit">
                    Submit Feedback
                </button>

            </form>


            {/* Error Message */}
            {error && (
                <div className="error">
                    {error}
                </div>
            )}


            {/* Success Message */}
            {success && (
                <div className="success">
                    {success}
                </div>
            )}


            <div className="footer">
                React Student Feedback Application
            </div>

        </div>
    );
}


// Main App Component
function App() {

    return (
        <FeedbackForm />
    );

}


// Render React Application
const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
